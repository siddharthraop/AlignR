[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alignr"
version = "0.1.0"
description = "Draft new DITA topics from the ones you have, and gate them before a writer sees them."
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = ["lxml>=5.3", "PyYAML>=6", "google-genai>=1.30"]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30", "google-cloud-firestore>=2.16"]
test = ["pytest>=8", "httpx>=0.27"]
docs = ["sphinx>=8", "myst-parser>=4", "furo>=2024.8"]

[project.scripts]
alignr = "alignr.cli:main"

[tool.setuptools]
packages = ["alignr", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]

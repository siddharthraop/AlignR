# Build the API image, prove it drafts the set with no key (baseline), push it, deploy it to Cloud Run, check it live.
name: deploy-api
on:
  push:
    branches: [main]
    paths: ["alignr/**", "api/**", "facts/**", "corpus", "Dockerfile", "pyproject.toml", ".github/workflows/deploy-api.yml"]
  workflow_dispatch:
concurrency:
  group: deploy-api
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write
env:
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  SERVICE: alignr-api
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: {submodules: true}
      - run: corpus/tools/fetch_grammar.sh
      - name: Build
        run: docker build --build-arg CORPUS_COMMIT="$(git -C corpus rev-parse HEAD)" -t alignr-api:ci .
      - name: Smoke test the container (no key, baseline drafts)
        run: |
          docker run -d --name api -p 8080:8080 -e ALIGNR_DAILY_DRAFTS=5 alignr-api:ci
          for i in $(seq 1 30); do curl -sf localhost:8080/api/health >/dev/null && break; sleep 1; done
          curl -s localhost:8080/api/health | jq -c .
          curl -sf -N -X POST localhost:8080/api/draft -H 'Content-Type: application/json' -d '{"generation":"tpu7x"}' > smoke.ndjson
          tail -1 smoke.ndjson | jq -e '.type == "result" and .run.metrics.grammar_failures_reaching_writer == 0' >/dev/null
          tail -1 smoke.ndjson | jq -c '.run.metrics'
          rid=$(tail -1 smoke.ndjson | jq -r .run.run)
          curl -sf "localhost:8080/api/runs/$rid/zip" -o set.zip && unzip -l set.zip
          echo "Image size: $(docker image inspect alignr-api:ci --format '{{.Size}}' | awk '{printf "%.0f MB", $1/1e6}')"
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Push
        id: push
        run: |
          IMAGE="$REGION-docker.pkg.dev/${{ vars.GCP_PROJECT }}/${{ vars.GCP_AR_REPO || 'tw-images' }}/alignr-api:${GITHUB_SHA::12}"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker tag alignr-api:ci "$IMAGE" && docker push -q "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
      - name: Deploy (0 to 1 instance, request-based billing)
        run: |
          gcloud run deploy "$SERVICE" --project="${{ vars.GCP_PROJECT }}" --region="$REGION" \
            --image="${{ steps.push.outputs.image }}" \
            --service-account="${{ vars.GCP_RUNTIME_SA }}" \
            --min-instances=0 --max-instances=1 --cpu-throttling --concurrency=4 --timeout=300 \
            --cpu=1 --memory=1Gi --port=8080 \
            --set-secrets="GOOGLE_API_KEY=gemini-api-key:latest" \
            --set-env-vars="ALIGNR_MODEL=gemini-3.8-flash,ALIGNR_FIRESTORE=1,ALIGNR_DAILY_DRAFTS=20,GOOGLE_CLOUD_PROJECT=${{ vars.GCP_PROJECT }}" \
            --labels="project=alignr,managed-by=deploy-api" --quiet
      - name: Check the live API
        run: |
          URL=$(gcloud run services describe "$SERVICE" --project="${{ vars.GCP_PROJECT }}" --region="$REGION" --format='value(status.url)')
          echo "::notice title=Service URL::$URL"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/health")
          if [ "$code" = "403" ]; then
            echo "::error title=Not public yet::Run once: gcloud run services add-iam-policy-binding $SERVICE --region=$REGION --member=allUsers --role=roles/run.invoker --project=${{ vars.GCP_PROJECT }}"
            exit 0
          fi
          curl -s "$URL/api/health" | jq -c .

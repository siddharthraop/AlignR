# Publish the design document, the AlignR page, the DITA help and the developer docs. Pages source: GitHub Actions.
name: pages
on:
  push:
    branches: [main]
    paths: ["index.html", "app/**", "help/**", "docs/**", "site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - id: dita-cache
        uses: actions/cache@v4
        with: {path: ~/dita-ot-4.4, key: dita-ot-4.4}
      - if: steps.dita-cache.outputs.cache-hit != 'true'
        run: curl -sSL -o /tmp/dita.zip https://github.com/dita-ot/dita-ot/releases/download/4.4/dita-ot-4.4.zip && unzip -q /tmp/dita.zip -d ~
      - run: pip install -q lxml sphinx myst-parser furo
      - run: ./site/build.sh _site
        env: {DITA_HOME: /home/runner/dita-ot-4.4}
      - uses: actions/upload-pages-artifact@v3
        with: {path: _site}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
